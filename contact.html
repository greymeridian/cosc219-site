<body>

            </ul>

        <h1>Contact Me:</h1>
    </header>
    <main>
        <section>
            <h2>Get in Touch:</h2>
            <p>If you need to reach out to me, please feel free to contact me via the following options.</p>
            <form>
                <fieldset>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </fieldset>
                <fieldset>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </fieldset>
                <fieldset>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </fieldset>
                <fieldset>  
                    <legend>Contact Method</legend>
                    <label for="contact-methods">Preferred contact method:</label>
                    <select name="contact-methods" id="contact-methods" required>
                        <option value="" disabled selected>Select a contact method</option>
                        <option value="email">Email</option>
                        <option value="phone">Phone</option>
                        <option value="discord">Discord</option>
                    </select>
                </fieldset>
                <fieldset>
                    <legend>Reply Request</legend>
                    <p>Would you like a reply to your message?</p>
                    <input type="checkbox" id="reply-request" name="reply-request" value="yes">
                    <label for="reply-request">Yes, I would like a reply</label><br>
                </fieldset>
                <fieldset>
                    <legend>Preferred Reply Method</legend>
                    <input type="radio" id="reply-methods" name="reply-methods" value="email" required>
                    <label for="reply-methods">Email</label><br>
                    <input type="radio" id="phone-reply" name="reply-methods" value="phone" required>
                    <label for="phone-reply">Phone</label><br>
                    <input type="radio" id="discord-reply" name="reply-methods" value="discord" required>
                    <label for="discord-reply">Discord</label><br>
                </fieldset>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
<footer>
    <!-- noreferrer enforced by VSCode autocomplete, ensures security by preventing referral tracking -->
    <p><a href="https://github.com/greymeridian" id="github-link" target="_blank" rel="noopener noreferrer">Check me out on GitHub</a></p>
    </footer>
</body>
</html>
